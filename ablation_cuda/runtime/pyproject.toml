[project]
name = "ablation-cuda-runtime"
version = "1.2.3"
description = "Locked query-time Biomedical RAG CUDA runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.12.0",
    "transformers==5.20.1",
    "tokenizers==0.23.3",
    "sentence-transformers==5.7.0",
    "huggingface-hub==2.2.0",
    "safetensors==0.8.0",
    "usearch==2.26.4",
    "numpy==2.5.4",
    "PyYAML==6.0.3",
    "spacy==3.8.16",
    "rank-bm25==0.2.2",
    "networkx==3.7",
    "tiktoken==0.14.0",
    "rich==14.3.4",
    "pydantic==2.14.1",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "pyarrow==26.0.0",
]

[dependency-groups]
test = ["pytest==9.0.2"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
package = false
