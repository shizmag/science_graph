archive_dir: /state/archive
db_path: /db/database.db
embedding:
  child_chunk_overlap: 50
  child_chunk_size: 300
  chunk_overlap: 200
  chunk_size: 1000
  model_name: /models/embedder
  parent_chunk_overlap: 200
  parent_chunk_size: 2500
graph_retrieval:
  allowed_retrieval_edge_types:
  - CITES
  - CITED_BY
  - MENTIONS_CONCEPT
  - RELATED_TO
  - HAS_TAG
  bridge_retrieval_enabled: true
  candidate_budget_mode: mirror_base
  chunks_per_graph_paper: 1
  concept_retrieval_enabled: true
  enabled: true
  intra_paper_candidate_augmentation_enabled: true
  max_graph_candidate_papers: auto
  max_graph_chunk_candidates: 2
  selected_sources_card_enabled: true
  single_token_concept_policy: idf_if_no_multitoken
  subbranch_policy: explicit
  trace_enabled: true
  use_author_edges_for_retrieval: false
  use_concept_idf: true
hf_token: ''
hyperparameters:
  bm25:
    k1: 1.5
  graph:
    b6_graph_neighbors_order: 1
    crawl_stop_threshold: 1.0
    essential_fact_threshold: 0.5
    gamma: 0.75
    p_base: 0.5
    semantic_score_threshold: 0.4
    semantic_score_top_p: 0.9
    sigmoid_center: 0.5
    sigmoid_score_threshold: 0.4
    sigmoid_score_top_p: 0.9
    sigmoid_slope: 0.0
    weight_authored: 0.8
    weight_cites: 0.7
    weight_default: 0.5
    weight_mentions_concept: 0.6
  rag:
    dynamic_alpha_threshold_low: 1.0
    dynamic_alpha_threshold_mid: 3.0
    dynamic_alpha_val_high: 1.0
    dynamic_alpha_val_low: 0.2
    dynamic_alpha_val_mid: 0.5
    rrf_k: 60.0
    score_blend_reranker_weight: 0.7
    score_blend_rrf_weight: 0.3
llm:
  auto_disable_mtp_if_missing_files: true
  chunk_pool_size: 1
  cloud:
    api_key: ''
    base_url: ''
    cheap_model_name: ''
    model_name: ''
    provider: disabled
    rag_model_name: ''
  clustering_input_limit: 6000
  clustering_output_limit: 1500
  enable_mtp: false
  evaluation:
    concurrency: 1
    retries: 5
    rpm: 10
  extraction_input_limit: 5000
  extraction_output_limit: 2048
  gguf:
    n_ctx: 4096
    n_gpu_layers: -1
  hyde_count: 1
  hyde_enabled: false
  hyde_max_tokens: 300
  local:
    model_path: /models/generator
    rag_model_path: /models/generator
  max_expanded_queries: 1
  max_tokens: 768
  model_max_context: 12000
  provider: cuda_torch
  request_delay: 0.0
  retry_backoff: 2.0
  synthesis_input_limit: 9500
  synthesis_output_limit: 768
  temp: 0.0
ner:
  model_name: disabled_not_used_by_query_runtime
pdf_compression:
  dpi_target: 150
  dpi_threshold: 151
  enabled: true
  quality: 75
pdf_parser: marker
rag_components:
  citation_repair: false
  context_trimming: true
  deduplicate_parent_chunks: true
  dense_search: true
  dynamic_alpha_blending: false
  graph_bridge_retrieval: false
  graph_concept_retrieval: false
  graph_expansion: true
  graph_neighbors_in_rrf: true
  graph_ontology_lookup: true
  graph_retrieval_trace: true
  graph_selected_sources_card: true
  hyde: false
  intent_classifier: false
  lexical_search: true
  llm_query_expansion: false
  reranker: true
  rrf: true
  score_blending: true
  shannon_estimator_enabled: true
  static_graph_context: true
reranker:
  model_name: /models/cross_encoder
spacy:
  model_name: en_core_web_md
