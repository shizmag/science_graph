[project]
name = "ablation-portability"
version = "0.1.0"
description = "Frozen data and database portability validation for the biomedical RAG ablation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lm-format-enforcer>=0.11.3,<1",
    "beautifulsoup4>=4.12,<5",
    "matplotlib>=3.8,<4",
    "mlx-lm>=0.21.0,<1",
    "networkx>=3,<4",
    "numpy>=1.26,<3",
    "openai>=1.12,<3",
    "pandas>=2,<4",
    "pydantic>=2,<3",
    "pymupdf>=1.24,<2",
    "pyyaml>=6,<7",
    "rank-bm25>=0.2.2,<1",
    "rich>=13,<15",
    "sentence-transformers>=3.4,<6",
    "seaborn>=0.13,<1",
    "spacy>=3.8,<4",
    "tiktoken>=0.13,<1",
    "torch>=2.4,<3",
    "transformers>=4.48,<6",
    "usearch>=2.9,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../back", "../back/benchmarks/rag"]
