        = 5.54, p = 0.022). ## Answer In patients with ischaemic heart disease and
        hypotension, symptomatic and silent ischaemia occurred in a temporally causal
        relation with hypotension, particularly for diastolic pressures, suggesting
        that patients with coronary disease may be susceptible to ischaemic events
        incurred as a result of low blood pressure caused by excessive hypotensive
        drug treatment.

