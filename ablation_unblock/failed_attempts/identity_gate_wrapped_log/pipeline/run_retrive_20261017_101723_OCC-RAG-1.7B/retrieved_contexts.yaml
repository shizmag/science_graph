        were enrolled, and 107 hypotensive events were documented. 40 ST events occurred
        in 14 patients, of which a quarter were symptomatic. Fourteen HII events occurred
        in eight patients, with 13 of the 14 preceded by a fall in diastolic pressure
        (median diastolic pressure 57.5 mm Hg, interquartile range 11, maximum 72
        mm Hg, minimum 45 mm Hg), and six preceded by a fall in systolic pressure
        (chi(2) = 11.9, p<0.001). ST events were significantly associated with preceding
        hypotensive events (chi(2) = 40.2, p<0.0001). Patients with HII events were
