      context_text: '<|source_start|><|source_id|>1 Block 1 (Score: 10.827) | Paper:
        PubMed 21084567: Are stroke patients'' reports of home blood pressure readings
        reliable? (Page 1):

        """

        # PubMed 21084567: Are stroke patients'' reports of home blood pressure readings
        reliable? ## Context Home blood pressure (BP) monitoring is gaining increasing
        popularity among patients and may be useful in hypertension management. Little
        is known about the reliability of stroke patients'' records of home BP monitoring.
        To assess the reliability of home BP recording in hypertensive patients who
        had suffered a recent stroke or transient ischaemic attack. Thirty-nine stroke
        patients (mean age 73 years) randomized to the intervention arm of a trial
        of home BP monitoring were included. Following instruction by a research nurse,
        patients recorded their BPs at home and documented them in a booklet over
        the next year. The booklet readings over a month were compared with the actual
        readings downloaded from the BP monitor and were checked for errors or selective
        bias in recording. A total of 1027 monitor and 716 booklet readings were recorded.
        Ninety per cent of booklet recordings were exactly the same as the BP monitor
        readings. Average booklet readings were 0.6 mmHg systolic [95% confidence
        interval (95% CI) -0.6 to 1.8] and 0.3 mmHg diastolic (95% CI -0.3 to 0.8)
        lower than those on the monitor. ## Answer This group of elderly stroke patients
        were able to record their BPs reliably at home. Any bias was small and would
        be unlikely to affect management. Since BP readings in a GP surgery are often
        a poor indication of true BP, GPs might consider using hypertensive patients''
        records of home BP monitoring to help guide treatment decisions.

        """<|source_end|>


        <|source_start|><|source_id|>2 Block 2 (Score: -6.522) | Paper: PubMed 26163474:
        Is there a connection between sublingual varices and hypertension? (Page 1):

        """

        # PubMed 26163474: Is there a connection between sublingual varices and hypertension?
        ## Context Sublingual varices have earlier been related to ageing, smoking
        and cardiovascular disease. The aim of this study was to investigate whether
        sublingual varices are related to presence of hypertension. In an observational
        clinical study among 431 dental patients tongue status and blood pressure
        were documented. Digital photographs of the lateral borders of the tongue
        for grading of sublingual varices were taken, and blood pressure was measured.
        Those patients without previous diagnosis of hypertension and with a noted
        blood pressure ≥ 140 mmHg and/or ≥ 90 mmHg at the dental clinic performed
        complementary home blood pressure during one week. Those with an average home
        blood pressure ≥ 135 mmHg and/or ≥ 85 mmHg were referred to the primary health
        care centre, where three office blood pressure measurements were taken with
        one week intervals. Two independent blinded observers studied the photographs
        of the tongues. Each photograph was graded as none/few (grade 0) or medium/severe
        (grade 1) presence of sublingual varices. Pearson''s Chi-square test, Student''s
        t-test, and multiple regression analysis were applied. Power calculation stipulated
        a study population of 323 patients. An association between sublingual varices
        and hypertension was found (OR = 2.25, p<0.002). Mean systolic blood pressure
        was 123 and 132 mmHg in patients with grade 0 and grade 1 sublingual varices,
        respectively (p<0.0001, CI 95 %). Mean diastolic blood pressure was 80 and
        83 mmHg in patients with grade 0 and grade 1 sublingual varices, respectively
        (p<0.005, CI 95 %). Sublingual varices indicate hypertension with a positive
        predictive value of 0.5 and a negative predictive value of 0.80. ## Answer
        An association was found between sublingual varices and hypertension. Examining
        the lateral borders of the tongue is easily done, causes no harm and could
        be a valuable method for the dental profession to take active part in preventive
        healthcare.

        """<|source_end|>


        <|source_start|><|source_id|>3 Block 3 (Score: -5.445) | Paper: PubMed 24669960:
        Does the sex of acute stroke patients influence the effectiveness of rt-PA?
        (Page 1):

        """

        # PubMed 24669960: Does the sex of acute stroke patients influence the effectiveness
        of rt-PA? ## Context Women have been reported to show more frequent recanalization
        and better recovery after intravenous (IV) recombinant tissue plasminogen
        activator (rt-PA) treatment for acute stroke compared with men. To investigate
        this we studied a series of stroke patients receiving IV rt-PA and undergoing
        acute transcranial doppler (TCD) examination. Acute stroke patients received
        IV rt-PA and had acute TCD examination within 4 hours of symptom onset at
        4 major stroke centers. TCD findings were interpreted using the Thrombolysis
        in Brain Ischemia (TIBI) flow grading system. The recanalization rates, and
        poor 3-month outcomes (modified Rankin scale>2) of men and women were compared
        using the chi-square test. Multiple regression analysis was used to assess
        sex as a predictor of recanalization and poor 3-month outcome after controlling
        for age, baseline NIH Stroke Scale (NIHSS), time to treatment, hypertension,
        and blood glucose. 369 patients had TCD examinations before or during IV rt-PA
        treatment. The 199 (53.9%) men and 170 (46.1%) women had mean ages of 67 ±
        13 and 70 ± 14 years, respectively. The sexes did not differ significantly
        in baseline stroke severity, time to TCD examination, or time to thrombolysis.
        Of the men, 68 (34.2%) had complete recanalization, 58 (29.1%) had partial
        recanalization, and 73 (36.6%) had no recanalization. Of the women, 53 (31.2%)
        had complete recanalization, 46 (27%) had partial recanalization, and 71 (41.8%)
        had no recanalization (p = 0.6). Multiple regression analyses showed no difference
        between the sexes in recanalization rate, time to recanalization, or clinical
        outcome at 3 months. ## Answer In our study; sex is not a significant predictor
        of recanalization rate, time to recanalization or 3-month outcome in stroke
        patients following IV rt-PA.

        """<|source_end|>


        <|source_start|><|source_id|>4 Block 4 (Score: -2.657) | Paper: PubMed 21823940:
        Department of Transportation vs self-reported data on motor vehicle collisions
        and driving convictions for stroke survivors: do they agree? (Page 1):

        """

        # PubMed 21823940: Department of Transportation vs self-reported data on motor
        vehicle collisions and driving convictions for stroke survivors: do they agree?
        ## Context Research on stroke survivors'' driving safety has typically used
        either self-reports or government records, but the extent to which the 2 may
        differ is not known. We compared government records and self-reports of motor
        vehicle collisions and driving convictions in a sample of stroke survivors.
        The 56 participants were originally recruited for a prospective study on driving
        and community re-integration post-stroke; the study population consisted of
        moderately impaired stroke survivors without severe communication disorders
        who had been referred for a driving assessment. The driving records of the
        56 participants for the 5 years before study entry and the 1-year study period
        were acquired with written consent from the Ministry of Transportation of
        Ontario (MTO), Canada. Self-reports of collisions and convictions were acquired
        via a semistructured interview and then compared with the MTO records. Forty-three
        participants completed the study. For 7 (13.5%) the MTO records did not match
        the self-reports regarding collision involvement, and for 9 (17.3%) the MTO
        records did not match self-reports regarding driving convictions. The kappa
        coefficient for the correlation between MTO records and self-reports was 0.52
        for collisions and 0.47 for convictions (both in the moderate range of agreement).
        When both sources of data were consulted, up to 56 percent more accidents
        and up to 46 percent more convictions were identified in the study population
        in the 5 years before study entry compared to when either source was used
        alone. ## Answer In our population of stroke survivors, self-reports of motor
        vehicle collisions and driving convictions differed from government records.
        In future studies, the use of both government and self-reported data would
        ensure a more accurate picture of driving safety post-stroke.

        """<|source_end|>


